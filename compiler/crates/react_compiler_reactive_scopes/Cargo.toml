[package]
name = "react_compiler_reactive_scopes"
version = "0.1.0"
edition = "2024"

[features]
# Off by default: gates the reactive-function debug printer
# (`print_reactive_function`). Forwards to `react_compiler_hir/debug`.
debug = ["react_compiler_hir/debug"]

[dependencies]
react_compiler_diagnostics = { path = "../react_compiler_diagnostics" }
react_compiler_hir = { path = "../react_compiler_hir" }
oxc_ast = "0.136.0"
oxc_allocator = "0.136.0"
oxc_parser = "0.136.0"
oxc_span = "0.136.0"
oxc_syntax = "0.136.0"
indexmap = "2"
hmac = "0.12"
sha2 = "0.10"
