[package]
name = "react_compiler"
version = "0.1.0"
edition = "2024"

[features]
# Off by default: gates the HIR debug printer + the per-pass debug-dump
# population in the pipeline (`--dump-hir`-only). Forwards to the printer
# features in the HIR and reactive-scopes crates.
debug = [
    "react_compiler_hir/debug",
    "react_compiler_reactive_scopes/debug",
]

[dependencies]
react_compiler_diagnostics = { path = "../react_compiler_diagnostics" }
react_compiler_hir = { path = "../react_compiler_hir" }
react_compiler_inference = { path = "../react_compiler_inference" }
react_compiler_lowering = { path = "../react_compiler_lowering" }
react_compiler_optimization = { path = "../react_compiler_optimization" }
react_compiler_reactive_scopes = { path = "../react_compiler_reactive_scopes" }
react_compiler_ssa = { path = "../react_compiler_ssa" }
react_compiler_typeinference = { path = "../react_compiler_typeinference" }
react_compiler_validation = { path = "../react_compiler_validation" }
oxc_allocator = "0.136.0"
oxc_ast = "0.136.0"
oxc_ast_visit = "0.136.0"
oxc_semantic = "0.136.0"
oxc_span = "0.136.0"
oxc_syntax = "0.136.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
